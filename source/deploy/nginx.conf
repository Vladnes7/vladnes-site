# Портфолио Vladnes и демо-сайты. Положить в /etc/nginx/sites-available/vladnes
# и включить ссылкой в sites-enabled. Домен vladnes.ru. После привязки домена к серверу
# выпустить сертификат: certbot --nginx -d vladnes.ru -d www.vladnes.ru

server {
    listen 80 default_server;
    server_name vladnes.ru www.vladnes.ru _;

    root /var/www/vladnes/portfolio;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Заявки с формы: nginx отдаёт их обработчику server/lead.mjs, который слушает только 127.0.0.1.
    location = /api/lead {
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    # Демо в подкаталогах. Поисковикам их не показываем.
    # ^~ нужен, чтобы правило для картинок и стилей ниже не перехватывало файлы демо.
    location ^~ /demo/ {
        alias /var/www/vladnes/demos/;
        index index.html;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location ~* \.(?:css|js|woff2|svg|png|jpg|jpeg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    error_page 404 /404.html;
}

# Archipila собрана с путями от корня, поэтому живёт на своём порту.
server {
    listen 8081;
    server_name _;

    root /var/www/vladnes/demos/archipila;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
